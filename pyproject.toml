[project]
name = "sous-svc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "flask>=3.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.0",
    "supabase>=2.34.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sous_svc"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
