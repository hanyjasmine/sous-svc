e</text><text x="434" y="551" class="t-sub" text-anchor="start" >turn finished</text><rect class="p-teal" x="810" y="360" width="760" height="240" rx="14"/><rect class="badge" x="826" y="378" width="30" height="30" rx="7"/><text x="841" y="398.5" class="t-badge" text-anchor="middle" >2</text><text x="868" y="401" text-anchor="start"><tspan class="t-h">Pick a tool</tspan><tspan class="t-meta" dx="18">repeat up to 4 rounds</tspan></text><rect class="c-teal hl" x="830" y="420" width="168" height="160" rx="10"/><g transform="translate(882,445.6) scale(1)"><path class="ic icf" d="M8 11h48L38 32v17l-12 7V32z"/></g><text x="914" y="540" class="t-label" text-anchor="middle" >Narrow</text><text x="914" y="563" class="t-sub" text-anchor="middle" >hide what doesn't fit</text><rect class="c-teal" x="1014" y="420" width="168" height="160" rx="10"/><g transform="translate(1066,445.6) scale(1)"><rect class="ic icf" x="12" y="7" width="40" height="50" rx="4"/><path class="ic" d="M20 19h24M20 29h24M20 39h24M20 49h14"/></g><text x="1098" y="540" class="t-label" text-anchor="middle" >Show all</text><text x="1098" y="563" class="t-sub" text-anchor="middle" >bring everything back</text><rect class="c-teal" x="1198" y="420" width="168" height="160" rx="10"/><g transform="translate(1250,445.6) scale(1)"><circle class="ic icf" cx="27" cy="27" r="16"/><path class="ic" d="M39 39l15 15"/></g><text x="1282" y="540" class="t-label" text-anchor="middle" >New search</text><text x="1282" y="563" class="t-sub" text-anchor="middle" >new filters, new list</text><rect class="c-teal" x="1382" y="420" width="168" height="160" rx="10"/><g transform="translate(1434,445.6) scale(1)"><path class="ic icf" d="M9 12h46v30H30l-11 11V42H9z"/><path class="ic" d="M19 23h26M19 31h17"/></g><text x="1466" y="540" class="t-label" text-anchor="middle" >Just answer</text><text x="1466" y="563" class="t-sub" text-anchor="middle" >no tool needed</text><path class="arrow" d="M1300,322 L1300,358"/><path class="arrow" d="M12